# Serveur de mises a jour du launcher : fichiers statiques seulement.
# Arborescence servie (volume ./donnees) :
#   /index.html              page d'accueil (generee par publier)
#   /launcher.json           configuration lue par le launcher
#   /manifest.json           liste des fichiers de mods (chemin, taille, sha256)
#   /mods/@Mod/...           fichiers de mods
#   /tfar/*.ts3_plugin       plugin TeamSpeak (facultatif)
#   /update/latest.json      mise a jour du launcher (format updater Tauri) + installeurs

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    autoindex off;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    max_ranges 16;
    etag on;

    gzip on;
    gzip_types application/json text/css text/plain;
    gzip_min_length 512;

    include /etc/nginx/snippets/securite.conf;

    location = /sante {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
    }

    location ~ (^|/)\. {
        return 404;
    }

    location ~ \.publier-tmp$ {
        return 404;
    }

    location = /index.html {
        include /etc/nginx/snippets/securite.conf;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    location ~ ^/(launcher|manifest)\.json$ {
        include /etc/nginx/snippets/securite.conf;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /update/latest.json {
        include /etc/nginx/snippets/securite.conf;
        add_header Cache-Control "no-cache" always;
    }

    location /update/ {
        types { }
        default_type application/octet-stream;
        include /etc/nginx/snippets/securite.conf;
        add_header Cache-Control "no-cache" always;
        add_header Content-Disposition "attachment" always;
    }

    location /mods/ {
        types { }
        default_type application/octet-stream;
        include /etc/nginx/snippets/securite.conf;
        # Les navigateurs et le launcher peuvent garder un jour ; un CDN (s-maxage) cinq minutes
        # seulement, pour qu'une mise a jour ne serve jamais longtemps un fichier perime.
        # Sans "always" : un 404 (fichier pas encore publie) n'est jamais mis en cache.
        add_header Cache-Control "public, max-age=86400, s-maxage=300";
    }

    location /tfar/ {
        types { }
        default_type application/octet-stream;
        include /etc/nginx/snippets/securite.conf;
        add_header Cache-Control "no-cache" always;
    }
}
